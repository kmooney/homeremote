[package]
name = "homeremote"
description = "Control a Samsung TV, Denon AVR, and Apple TV over IP."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["denon", "samsung", "appletv"]
denon = []
samsung = []
appletv = []

[dependencies]
async-trait = "0.1.92"
base64 = "0.23.1"
directories = "6.0.0"
futures-util = "0.3.34"
if-addrs = "0.15.0"
mdns-sd = "0.21.1"
rand = "0.10.2"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json", "charset", "http2"] }
roxmltree = "0.21.1"
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1.15.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
socket2 = "0.6.5"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["net", "time", "sync", "rt", "macros", "io-util"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
toml = "1.1.5"
tracing = "0.1.44"
