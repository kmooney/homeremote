; Firmware for the Wi-Fi to IR bridge: an M5Stack ATOM Lite / ATOM Matrix
; (ESP32-PICO-D4) that turns HTTP requests from homeremote into Samsung IR.
;
;   cp src/secrets.example.h src/secrets.h   # then fill in the Wi-Fi details
;   pio run -t upload                        # flash over USB
;   pio device monitor                       # watch it join the network

[env:atom]
platform = espressif32@6.9.0
board = m5stack-atom
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
lib_deps =
    crankyoldgit/IRremoteESP8266@2.8.6
